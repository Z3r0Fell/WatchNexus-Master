version: '3.8'

services:
  watchnexus:
    build:
      context: ../../
      dockerfile: builds/Docker/Dockerfile
    container_name: watchnexus
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      # Persistent data storage
      - watchnexus_data:/data
      # Media directories (customize these paths)
      - /path/to/movies:/media/movies:ro
      - /path/to/tv:/media/tv:ro
      - /path/to/music:/media/music:ro
    environment:
      - TZ=America/New_York
      - JWT_SECRET=change-this-to-a-secure-random-string
      # Optional: Add your TMDB API key for metadata
      # - TMDB_API_KEY=your-key-here
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  watchnexus_data:
    driver: local

