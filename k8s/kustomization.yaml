# WatchNexus Kustomize Overlay
# Usage: kubectl apply -k k8s/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: watchnexus

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

commonLabels:
  app.kubernetes.io/name: watchnexus
  app.kubernetes.io/version: "1.0.8"
  app.kubernetes.io/managed-by: kustomize

images:
  - name: watchnexus/watchnexus
    newTag: 1.0.8-ultra

# configMapGenerator/secretGenerator (behavior: merge) were removed: the
# secretGenerator overwrote the values a user puts in secret.yaml with the
# literal "REPLACE_ME" (incl. JWT_SECRET), and the configMapGenerator only
# duplicated WATCHNEXUS_TIER from configmap.yaml. Edit configmap.yaml /
# secret.yaml directly.
