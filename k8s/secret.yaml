# WatchNexus Secrets (Sensitive - Base64 Encoded)
# 
# Generate secrets:
#   JWT_SECRET: openssl rand -hex 48
#   LICENSE_SERVER_API_KEY: from licenses.watchnexus.ca admin panel
#   TMDB_API_KEY: from themoviedb.org settings
#
# Apply: kubectl apply -f secret.yaml
# View: kubectl get secret watchnexus-secrets -n watchnexus -o yaml
#
apiVersion: v1
kind: Secret
metadata:
  name: watchnexus-secrets
  namespace: watchnexus
  labels:
    app.kubernetes.io/name: watchnexus
    app.kubernetes.io/version: "1.0.7"
type: Opaque
stringData:
  # 96-char hex (48 bytes) - per-install JWT signing secret
  # Leave empty to auto-generate a per-install key in the data PVC, or set
  # `openssl rand -hex 48`. (The old 32-char placeholder passed the length
  # check and became a publicly known signing key if left unchanged.)
  JWT_SECRET: ""
  
  # License server API key (from admin panel)
  LICENSE_SERVER_API_KEY: "REPLACE_WITH_YOUR_LICENSE_API_KEY"
  
  # TMDB v3 API key (from themoviedb.org)
  TMDB_API_KEY: "REPLACE_WITH_YOUR_TMDB_API_KEY"
  
  # Optional: Custom encryption password for backups
  # BACKUP_ENCRYPTION_PASSWORD: "REPLACE_WITH_STRONG_PASSWORD"