# WatchNexus Persistent Volume Claims
# 
# StorageClass: Use your cluster's default or specify one (e.g., "fast-ssd", "nfs-client")
# AccessMode: ReadWriteOnce for single-node, ReadWriteMany for multi-node (requires RWX storage)
#
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: watchnexus-data
  namespace: watchnexus
  labels:
    app.kubernetes.io/name: watchnexus
    app.kubernetes.io/version: "1.0.4"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  # storageClassName: fast-ssd  # Uncomment and set if needed
---
