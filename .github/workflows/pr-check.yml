name: PR Build Check

on:
  pull_request:
    branches: [main, develop]

jobs:
  test-csharp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore src/watchnexus/WatchNexus.sln
      - name: Build
        run: dotnet build src/watchnexus/WatchNexus.sln --no-restore --configuration Release
      - name: Test
        run: dotnet test src/watchnexus/tests/WatchNexus.Tests.csproj --no-restore --configuration Release --logger "console;verbosity=normal"

  test-react:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install deps
        run: yarn install --frozen-lockfile
        working-directory: frontend
      - name: Test
        run: npx craco test --watchAll=false --passWithNoTests
        working-directory: frontend

  docker-build:
    runs-on: ubuntu-latest
    needs: [test-csharp, test-react]
    strategy:
      matrix:
        tier: [standard, pro, ultra]
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.tier }} (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          build-args: TIER=${{ matrix.tier }}
          cache-from: type=gha,scope=${{ matrix.tier }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tier }}
      - name: Summary
        run: echo "${{ matrix.tier }} tier builds successfully" >> $GITHUB_STEP_SUMMARY
