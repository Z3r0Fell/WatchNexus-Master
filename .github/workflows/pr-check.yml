# ══════════════════════════════════════════════════════════════════════
# WatchNexus — Multi-tier Build Validation
# Verifies the Standard/Pro/Ultra Docker images compile. Runs on PRs,
# on pushes to main (direct-to-main workflow), and on demand.
# ══════════════════════════════════════════════════════════════════════

name: PR Build Check

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tier: [standard, pro, ultra]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.tier }} (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          build-args: TIER=${{ matrix.tier }}
          cache-from: type=gha,scope=${{ matrix.tier }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tier }}

      - name: Summary
        run: echo "${{ matrix.tier }} tier builds successfully" >> $GITHUB_STEP_SUMMARY
