# ══════════════════════════════════════════════════════════════════════
# WatchNexus — Release Notes Generator
# Generates release notes from PRs, commits, and changelog
# Runs on release workflow or manually
# ═════════════════════════════════════════════════════════════════════

name: Generate Release Notes

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to generate notes for'
        required: true
        type: string
      previous_tag:
        description: 'Previous tag to compare against'
        required: false
        type: string
    outputs:
      release_notes:
        description: 'Generated release notes markdown'
        value: ${{ jobs.generate.outputs.release_notes }}

  workflow_dispatch:
    inputs:
      version:
        description: 'Version to generate notes for'
        required: true
        type: string
      previous_tag:
        description: 'Previous tag (optional)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  generate:
    name: Generate Release Notes
    runs-on: ubuntu-latest
    outputs:
      release_notes: ${{ steps.generate.outputs.release_notes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine previous tag
        id: prev_tag
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          
          if [ -n "${{ github.event.inputs.previous_tag }}" ]; then
            PREV_TAG="${{ github.event.inputs.previous_tag }}"
          else
            # Find previous semver tag
            PREV_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -A1 "^v${VERSION}$" | tail -1)
            if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "v${VERSION}" ]; then
              PREV_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
            fi
          fi
          
          echo "previous_tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Get commits since previous tag
        id: commits
        run: |
          PREV_TAG="${{ steps.prev_tag.outputs.previous_tag }}"
          VERSION="${{ steps.prev_tag.outputs.version }}"
          
          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "v${VERSION}" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%an)" ${PREV_TAG}..HEAD --oneline)
          else
            COMMITS=$(git log --pretty=format:"- %s (%an)" -20 --oneline)
          fi
          
          echo "commits<<EOF" >> "$GITHUB_OUTPUT"
          echo "$COMMITS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Get merged PRs since previous tag
        id: prs
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.prev_tag.outputs.version }}';
            const prevTag = '${{ steps.prev_tag.outputs.previous_tag }}';
            
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed',
              sort: 'updated',
              direction: 'desc',
              per_page: 50
            });
            
            const merged = pulls
              .filter(pr => pr.merged_at)
              .filter(pr => {
                if (!prevTag || prevTag === `v${version}`) return true;
                return new Date(pr.merged_at) > new Date();
              })
              .slice(0, 30)
              .map(pr => `- #${pr.number}: ${pr.title} (@${pr.user.login})`)
              .join('\n');
            
            return merged;

      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${{ steps.prev_tag.outputs.version }}"
          
          # Extract from CHANGELOG.md
          awk -v ver="$VERSION" '
            /^## / { 
              if (found && !/v'${VERSION}'/) exit
              if ($0 ~ ver) found=1
            }
            found { print }
          ' CHANGELOG.md | head -n -1 > /tmp/changelog_extract.md
          
          if [ -s /tmp/changelog_extract.md ]; then
            CHANGELOG=$(cat /tmp/changelog_extract.md | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')
          else
            CHANGELOG="See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details."
          fi
          
          echo "changelog=${CHANGELOG}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: generate
        run: |
          VERSION="${{ steps.prev_tag.outputs.version }}"
          PREV_TAG="${{ steps.prev_tag.outputs.previous_tag }}"
          COMMITS="${{ steps.commits.outputs.commits }}"
          PRS="${{ steps.prs.outputs.result }}"
          CHANGELOG="${{ steps.changelog.outputs.changelog }}"
          
          cat > /tmp/release_notes.md << EOF
  # WatchNexus v${VERSION}
  
  **Release Date:** $(date -u +"%B %d, %Y")
  
  ${CHANGELOG}
  
  ---
  
  ## 📦 Merged Pull Requests
  
  ${PRS:-"No PRs in this range"}
  
  ---
  
  ## 🔧 Commits
  
  ${COMMITS:-"No commits in this range"}
  
  ---
  
  ## 🐳 Docker Images
  
  \`\`\`bash
  # Standard (free)
  docker pull ghcr.io/${{ github.repository_owner }}/watchnexus:${VERSION}-standard
  
  # Pro
  docker pull ghcr.io/${{ github.repository_owner }}/watchnexus:${VERSION}-pro
  
  # Ultra
  docker pull ghcr.io/${{ github.repository_owner }}/watchnexus:${VERSION}-ultra
  \`\`\`
  
  ## 📥 Native Installers
  
  Download from [GitHub Releases](https://github.com/${{ github.repository }}/releases/tag/v${VERSION}) or [watchnexus.ca](https://watchnexus.ca/download).
  
  | Platform | Standard | Pro | Ultra |
  |----------|----------|-----|-------|
  | Windows | `.exe` | `.exe` | `.exe` |
  | Debian/Ubuntu | `.deb` | `.deb` | `.deb` |
  | Fedora/RHEL | `.rpm` | `.rpm` | `.rpm` |
  | Arch Linux | `.pkg.tar.zst` | `.pkg.tar.zst` | `.pkg.tar.zst` |
  | macOS | Homebrew | Homebrew | Homebrew |
  
  ## 🔐 License Activation
  
  Pro and Ultra tiers require a license key from [licenses.watchnexus.ca](https://licenses.watchnexus.ca).
  
  ## ⬆️ Upgrade Notes
  
  - Run \`docker compose pull && docker compose up -d\` for Docker deployments
  - Native packages: upgrade via package manager (dpkg/rpm/pacman)
  - Fortress integrity check runs automatically on startup
  - Database migrations apply automatically
  
  ## 📚 Documentation
  
  - [API Reference](https://docs.watchnexus.ca/api)
  - [User Guide](https://docs.watchnexus.ca/guide)
  - [Tier Comparison](https://watchnexus.ca/pricing)
  
  ---
  
  **Full Changelog:** https://github.com/${{ github.repository }}/compare/${PREV_TAG}...v${VERSION}
  EOF
          
          cat /tmp/release_notes.md
          RELEASE_NOTES=$(cat /tmp/release_notes.md | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')
          echo "release_notes=${RELEASE_NOTES}" >> "$GITHUB_OUTPUT"