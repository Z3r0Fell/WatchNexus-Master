# ══════════════════════════════════════════════════════════════════════
# WatchNexus — CI/CD Pipeline
# Builds and pushes Docker images for all 3 tiers on release tags.
#
# Triggers:
#   - Push tag matching v*.*.* (e.g., v2.8.4)
#   - Manual workflow dispatch
#
# Publishes to GitHub Container Registry (ghcr.io)
# Images:
#   ghcr.io/<owner>/watchnexus:2.8.4-standard
#   ghcr.io/<owner>/watchnexus:2.8.4-pro
#   ghcr.io/<owner>/watchnexus:2.8.4-ultra
#   ghcr.io/<owner>/watchnexus:latest
# ══════════════════════════════════════════════════════════════════════

name: Build & Publish Docker Images

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tier:
        description: 'Tier to build (standard, pro, ultra, all)'
        required: false
        default: 'all'
      push:
        description: 'Push images to registry'
        required: false
        default: 'true'
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/watchnexus

permissions:
  contents: read
  packages: write

jobs:
  # ── Extract version from tag ─────────────────────────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tiers: ${{ steps.tiers.outputs.matrix }}
    steps:
      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION="dev-$(date +%Y%m%d)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version: ${VERSION}"

      - name: Determine tiers
        id: tiers
        run: |
          TIER_INPUT="${{ github.event.inputs.tier || 'all' }}"
          if [ "$TIER_INPUT" = "all" ]; then
            echo 'matrix=["standard","pro","ultra"]' >> "$GITHUB_OUTPUT"
          else
            echo "matrix=[\"${TIER_INPUT}\"]" >> "$GITHUB_OUTPUT"
          fi

  # ── Build & Push per tier ────────────────────────────────────────
  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tier: ${{ fromJson(needs.prepare.outputs.tiers) }}
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}-${{ matrix.tier }}
            type=raw,value=latest-${{ matrix.tier }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event.inputs.push != 'false' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            com.watchnexus.tier=${{ matrix.tier }}
            com.watchnexus.version=${{ needs.prepare.outputs.version }}
          build-args: |
            TIER=${{ matrix.tier }}
          cache-from: type=gha,scope=${{ matrix.tier }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tier }}
          platforms: linux/amd64,linux/arm64

      - name: Output image info
        run: |
          echo "## ${{ matrix.tier }} image built" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}-${{ matrix.tier }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-${{ matrix.tier }}\`" >> $GITHUB_STEP_SUMMARY

  # ── Tag Ultra as default latest ──────────────────────────────────
  tag-latest:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    if: contains(fromJson(needs.prepare.outputs.tiers), 'ultra')
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag ultra as latest
        run: |
          docker buildx imagetools create \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}-ultra
          echo "## Tagged as latest" >> $GITHUB_STEP_SUMMARY
          echo "\`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest\` → ultra" >> $GITHUB_STEP_SUMMARY

  # ── Create GitHub Release ────────────────────────────────────────
  release:
    needs: [prepare, build, tag-latest]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: WatchNexus v${{ needs.prepare.outputs.version }}
          body: |
            ## WatchNexus v${{ needs.prepare.outputs.version }}

            ### Docker Images
            ```bash
            # Standard (free)
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}-standard

            # Pro
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}-pro

            # Ultra
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}-ultra
            ```

            ### Quick Start
            ```bash
            docker run -d -p 8002:8002 \
              -v watchnexus-data:/app/data \
              -v /path/to/media:/data/media \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}-standard
            ```

            ### Tier Comparison
            | | Standard | Pro | Ultra |
            |---|---------|-----|-------|
            | Controllers | 14 | 23 | 46 |
            | Frontend Pages | 26 | 41 | 57 |
            | Media Library | Yes | Yes | Yes |
            | Automation | - | Yes | Yes |
            | Analytics | - | Yes | Yes |
            | Security Suite | - | - | Yes |
            | Hardware Transcode | - | - | Yes |
            | Disc Ripping | - | - | Yes |
            | Gaming Console | - | - | Yes |

            Activate Pro or Ultra with a serial number from [licenses.watchnexus.ca](https://licenses.watchnexus.ca)
          generate_release_notes: true
