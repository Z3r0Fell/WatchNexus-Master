name: Security Scan

on:
  push:
    branches: [main, develop, Dev]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          language: ${{ matrix.language }}
      - name: Setup Node.js
        if: matrix.language == 'javascript-typescript'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: src/web/yarn.lock
      - name: Install frontend dependencies
        if: matrix.language == 'javascript-typescript'
        working-directory: src/web
        run: yarn install --frozen-lockfile
      - name: Setup .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build .NET (autobuild)
        if: matrix.language == 'csharp'
        uses: github/codeql-action/autobuild@v3
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  dotnet-deps:
    name: .NET dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore src/watchnexus/core/WatchNexus.Core.csproj
      - name: List vulnerable packages
        run: dotnet list src/watchnexus/core/WatchNexus.Core.csproj package --vulnerable --include-transitive

  frontend-deps:
    name: Frontend dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: src/web
        run: yarn install --frozen-lockfile
      - name: Audit production dependencies (fails on critical)
        working-directory: src/web
        run: |
          set +e
          yarn audit --groups dependencies --json > audit.json 2>/dev/null
          CRIT=$(grep -c '"severity":"critical"' audit.json)
          HIGH=$(grep -c '"severity":"high"' audit.json)
          echo "Production deps — critical: $CRIT, high: $HIGH"
          {
            echo "### Frontend dependency audit (production dependencies)"
            echo "- Critical: $CRIT"
            echo "- High: $HIGH"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$CRIT" -gt 0 ]; then
            echo "::error::$CRIT critical vulnerabilities found in production dependencies"
            exit 1
          fi
      - name: Advisory audit incl. devDependencies (informational only)
        working-directory: src/web
        run: yarn audit --level high || true
