name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-tests:
    name: C# unit tests (xUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore src/watchnexus/WatchNexus.sln
      - name: Test
        run: dotnet test src/watchnexus/WatchNexus.sln --no-restore -p:SkipFrontendBuild=true --logger "trx;LogFileName=results.trx"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: '**/TestResults/*.trx'

  frontend-tests:
    name: React tests (Jest + RTL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: src/web/yarn.lock
      - name: Install
        run: yarn install --frozen-lockfile
      - name: Test
        run: yarn test --watchAll=false --ci
        env:
          CI: 'true'
