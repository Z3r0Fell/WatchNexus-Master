# WatchNexus nginx Configuration
# 
# Install: sudo cp watchnexus.conf /etc/nginx/sites-available/
# Enable: sudo ln -s /etc/nginx/sites-available/watchnexus.conf /etc/nginx/sites-enabled/
# Test: sudo nginx -t && sudo systemctl reload nginx
#
# Requires: nginx with http_ssl_module, http_v2_module

# Upstream backend
upstream watchnexus_backend {
    server localhost:8001;
    keepalive 32;
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name watchnexus.yourdomain.com;
    
    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    
    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name watchnexus.yourdomain.com;
    
    # SSL certificates (Let's Encrypt via certbot)
    ssl_certificate /etc/letsencrypt/live/watchnexus.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/watchnexus.yourdomain.com/privkey.pem;
    
    # SSL security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # HSTS (enable after confirming HTTPS works)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    
    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/xml+rss text/javascript;
    
    # Client body size for large uploads
    client_max_body_size 50G;
    
    # Proxy timeouts for long operations
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 10s;
    
    # Proxy settings
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_cache off;
    proxy_buffering off;
    proxy_request_buffering off;
    
    # Health check (no auth, no logging)
    location = /api/health {
        proxy_pass http://watchnexus_backend;
        access_log off;
    }
    
    # WatchParty WebSocket
    location /api/watch-party/ {
        proxy_pass http://watchnexus_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;  # Long-lived WebSocket
        proxy_send_timeout 86400s;
    }
    
    # Media streaming - disable buffering
    location /api/media/stream/ {
        proxy_pass http://watchnexus_backend;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
    }
    
    # API routes
    location /api/ {
        proxy_pass http://watchnexus_backend;
    }
    
    # Static assets (frontend build)
    location /build/ {
        proxy_pass http://watchnexus_backend;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    location /static/ {
        proxy_pass http://watchnexus_backend;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # Favicon, manifest, robots
    location ~* \.(ico|png|jpg|jpeg|gif|svg|webp|woff|woff2|ttf|eot)$ {
        proxy_pass http://watchnexus_backend;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # SPA fallback - serve index.html for all other routes
    location / {
        proxy_pass http://watchnexus_backend;
        # Don't intercept API 404s
        proxy_intercept_errors off;
    }
    
    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}