<!DOCTYPE html>
<html lang="en" class="shell">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WatchNexus — Your Complete Media Pipeline</title>
  <meta name="description" content="WatchNexus is your unified, self-hosted media pipeline. Replace Sonarr, Radarr, Jellyfin, and more with a single powerful application.">
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="shell">

<nav class="shell-nav">
  <a class="shell-nav-logo" onclick="loadPage('home')">
    <img src="assets/images/watchnexus-logo.png" alt="WatchNexus">
    WatchNexus
  </a>

  <ul class="shell-nav-links" id="nav-links">
    <li><a data-page="features"  onclick="loadPage('features')">Features</a></li>
    <li><a data-page="download"  onclick="loadPage('download')">Download</a></li>
    <li><a data-page="faq"       onclick="loadPage('faq')">FAQ</a></li>
    <li><a data-page="support"   onclick="loadPage('support')">Support</a></li>
  </ul>

  <div class="shell-nav-right">
    <a class="btn btn-primary" onclick="loadPage('download')">
      <i class="fa-solid fa-download"></i> Get Started
    </a>
    <button class="nav-toggle" id="nav-toggle" aria-label="Menu">
      <i class="fa-solid fa-bars"></i>
    </button>
  </div>
</nav>

<div class="shell-frame-wrap">
  <iframe id="main-frame" src="home.html" title="WatchNexus"></iframe>
</div>

<script>
const frame   = document.getElementById('main-frame');
const navLinks = document.getElementById('nav-links');
const toggle  = document.getElementById('nav-toggle');

const pages = {
  home:     'home.html',
  download: 'download.html',
  features: 'features.html',
  faq:      'faq.html',
  support:  'support.html',
  press:    'press.html',
};

function loadPage(key) {
  if (!pages[key]) return;
  frame.src = pages[key];
  setActive(key);
  history.replaceState(null, '', '#' + key);
  navLinks.classList.remove('open');
}

function setActive(key) {
  document.querySelectorAll('.shell-nav-links a').forEach(a => {
    a.classList.toggle('active', a.dataset.page === key);
  });
}

// Detect iframe navigations (in-page links like "Download Free" buttons)
frame.addEventListener('load', () => {
  try {
    const src = frame.contentWindow.location.pathname.split('/').pop().replace('.html','');
    const key = Object.keys(pages).find(k => pages[k] === src + '.html') || src;
    if (pages[key]) {
      setActive(key);
      history.replaceState(null, '', '#' + key);
    }
  } catch(e) {}
});

// Hash routing on page load
const hash = location.hash.replace('#','');
if (hash && pages[hash]) {
  frame.src = pages[hash];
  setActive(hash);
} else {
  setActive('home');
}

// Mobile menu
toggle.addEventListener('click', () => navLinks.classList.toggle('open'));

// Close mobile menu on link click
navLinks.querySelectorAll('a').forEach(a => {
  a.addEventListener('click', () => navLinks.classList.remove('open'));
});
</script>
</body>
</html>
