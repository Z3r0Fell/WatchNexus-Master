# ══════════════════════════════════════════════════════════════════════
# WatchNexus — Docker Compose (Multi-Tier)
# Usage:
#   docker compose --profile standard up -d
#   docker compose --profile pro up -d
#   docker compose --profile ultra up -d
# Or build all: docker compose build
# ══════════════════════════════════════════════════════════════════════

services:
  # ── Standard Edition ─────────────────────────────────────────────
  watchnexus-standard:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TIER: standard
    image: watchnexus/watchnexus:1.0.1-standard
    container_name: watchnexus-standard
    profiles: ["standard"]
    ports:
      - "8002:8002"
    volumes:
      - watchnexus-data-std:/app/data
      - media-library:/data/media
    environment:
      - WATCHNEXUS_TIER=standard
      - WATCHNEXUS_DATA_DIR=/app/data
      - ASPNETCORE_ENVIRONMENT=Production
      - TZ=America/Toronto
      - LICENSE_SERVER_URL=https://licenses.watchnexus.ca
      - LICENSE_SERVER_API_KEY=${LICENSE_SERVER_API_KEY}
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped

  # ── Pro Edition ──────────────────────────────────────────────────
  watchnexus-pro:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TIER: pro
    image: watchnexus/watchnexus:1.0.1-pro
    container_name: watchnexus-pro
    profiles: ["pro"]
    ports:
      - "8001:8001"
    volumes:
      - watchnexus-data-pro:/app/data
      - media-library:/data/media
      - rips:/data/rips
    environment:
      - WATCHNEXUS_TIER=pro
      - WATCHNEXUS_DATA_DIR=/app/data
      - ASPNETCORE_ENVIRONMENT=Production
      - TZ=America/Toronto
      - LICENSE_SERVER_URL=https://licenses.watchnexus.ca
      - LICENSE_SERVER_API_KEY=${LICENSE_SERVER_API_KEY}
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped

  # ── Ultra Edition ────────────────────────────────────────────────
  watchnexus-ultra:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TIER: ultra
    image: watchnexus/watchnexus:1.0.1-ultra
    container_name: watchnexus-ultra
    profiles: ["ultra"]
    ports:
      - "8001:8001"
    volumes:
      - watchnexus-data-ultra:/app/data
      - media-library:/data/media
      - rips:/data/rips
      - transcoded:/data/transcoded
      - offline:/data/offline
    environment:
      - WATCHNEXUS_TIER=ultra
      - WATCHNEXUS_DATA_DIR=/app/data
      - ASPNETCORE_ENVIRONMENT=Production
      - TZ=America/Toronto
      - LICENSE_SERVER_URL=https://licenses.watchnexus.ca
      - LICENSE_SERVER_API_KEY=${LICENSE_SERVER_API_KEY}
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 1G
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  watchnexus-data-std:
  watchnexus-data-pro:
  watchnexus-data-ultra:
  media-library:
  rips:
  transcoded:
  offline:
