# ══════════════════════════════════════════════════════════════════════
# WatchNexus — Docker Compose (Multi-Tier)
# Usage:
#   docker compose --profile standard up -d
#   docker compose --profile pro up -d
#   docker compose --profile ultra up -d
# Or build all: docker compose build
# ══════════════════════════════════════════════════════════════════════

services:
  # ── Standard Edition ─────────────────────────────────────────────
  watchnexus-standard:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TIER: standard
    image: watchnexus/watchnexus:1.0.0-standard
    container_name: watchnexus-standard
    profiles: ["standard"]
    ports:
      - "8002:8002"
    volumes:
      - watchnexus-data-std:/app/data
      - media-library:/data/media
    environment:
      - WATCHNEXUS_TIER=standard
      # Leave JWT_SECRET unset — the server auto-generates a strong per-install
      # secret on first boot and persists it to the data volume. Never ship a
      # shared/hardcoded signing key.
      - JWT_SECRET=${JWT_SECRET:-}
      - LICENSE_SERVER_URL=https://licenses.watchnexus.ca
      - LICENSE_SERVER_API_KEY=${LICENSE_SERVER_API_KEY:-}
    restart: unless-stopped

  # ── Pro Edition ──────────────────────────────────────────────────
  watchnexus-pro:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TIER: pro
    image: watchnexus/watchnexus:1.0.0-pro
    container_name: watchnexus-pro
    profiles: ["pro"]
    ports:
      - "8002:8002"
    volumes:
      - watchnexus-data-pro:/app/data
      - media-library:/data/media
      - rips:/data/rips
    environment:
      - WATCHNEXUS_TIER=pro
      # Leave JWT_SECRET unset — the server auto-generates a strong per-install
      # secret on first boot and persists it to the data volume. Never ship a
      # shared/hardcoded signing key.
      - JWT_SECRET=${JWT_SECRET:-}
      - LICENSE_SERVER_URL=https://licenses.watchnexus.ca
      - LICENSE_SERVER_API_KEY=${LICENSE_SERVER_API_KEY:-}
    restart: unless-stopped

  # ── Ultra Edition ────────────────────────────────────────────────
  watchnexus-ultra:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TIER: ultra
    image: watchnexus/watchnexus:1.0.0-ultra
    container_name: watchnexus-ultra
    profiles: ["ultra"]
    ports:
      - "8002:8002"
    volumes:
      - watchnexus-data-ultra:/app/data
      - media-library:/data/media
      - rips:/data/rips
      - transcoded:/data/transcoded
      - offline:/data/offline
    environment:
      - WATCHNEXUS_TIER=ultra
      # Leave JWT_SECRET unset — the server auto-generates a strong per-install
      # secret on first boot and persists it to the data volume. Never ship a
      # shared/hardcoded signing key.
      - JWT_SECRET=${JWT_SECRET:-}
      - LICENSE_SERVER_URL=https://licenses.watchnexus.ca
      - LICENSE_SERVER_API_KEY=${LICENSE_SERVER_API_KEY:-}
    # GPU passthrough for hardware transcoding (NVIDIA)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  watchnexus-data-std:
  watchnexus-data-pro:
  watchnexus-data-ultra:
  media-library:
  rips:
  transcoded:
  offline:
