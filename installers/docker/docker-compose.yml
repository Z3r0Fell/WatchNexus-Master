services:
  watchnexus:
    build: .
    container_name: watchnexus
    ports:
      - "8001:8001"
    volumes:
      - watchnexus-data:/opt/watchnexus/backend/data
      - watchnexus-logs:/opt/watchnexus/backend/logs
      - /path/to/your/media:/media:ro    # Mount your media libraries here
    environment:
      - WATCHNEXUS_PORT=8001
      - TMDB_API_KEY=               # Optional: Your TMDB API key
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  watchnexus-data:
  watchnexus-logs:
