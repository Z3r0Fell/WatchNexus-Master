services:
  watchnexus:
    # Builds the official multi-tier image from the repo-root Dockerfile.
    # (context ".." pointed at installers/, which has no Dockerfile and no
    # src/ tree, so `docker compose up` could never build.)
    image: watchnexus/watchnexus:1.0.6-standard
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        TIER: standard
        PORT: 8001
    container_name: watchnexus
    ports:
      - "8001:8001"
    volumes:
      - watchnexus-data:/app/data
      - /path/to/your/media:/data/media:ro    # Mount your media libraries here
    environment:
      - WATCHNEXUS_PORT=8001
      - WATCHNEXUS_DATA_DIR=/app/data
      - ASPNETCORE_ENVIRONMENT=Production
      - TZ=America/Toronto
      # - TMDB_API_KEY=your-key      # Optional (an empty value would override the built-in fallback)
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${WATCHNEXUS_PORT:-8001}/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  watchnexus-data:
