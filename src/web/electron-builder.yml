appId: com.watchnexus.app
productName: WatchNexus
copyright: Copyright © 2025 WatchNexus
artifactName: WatchNexus-${version}-${os}-${arch}.${ext}

directories:
  output: dist
  buildResources: assets

files:
  - build/**/*
  - electron/**/*
  - package.json

extraResources:
  - from: ../watchnexus/core/bin/Release/net10.0/publish/
    to: backend
    filter:
      - "**/*"

mac:
  category: public.app-category.entertainment
  icon: assets/watchnexus.icns
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: electron/entitlements.mac.plist
  entitlementsInherit: electron/entitlements.mac.plist

dmg:
  background: assets/dmg-background.png
  iconSize: 128
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  icon: assets/watchnexus.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: assets/watchnexus.ico
  uninstallerIcon: assets/watchnexus.ico
  installerHeaderIcon: assets/watchnexus.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: WatchNexus

linux:
  icon: assets/icons
  category: AudioVideo
  synopsis: Unified media pipeline - request, acquire, organize, and watch
  description: |
    WatchNexus is a self-hosted media solution that combines the functionality
    of multiple applications into one. Handle TV shows, movies, audiobooks,
    music, and more from a single interface.
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64

appImage:
  artifactName: WatchNexus-${version}.AppImage
  desktop:
    Name: WatchNexus
    Comment: Unified Media Pipeline
    Categories: AudioVideo;Video;Player;
    Keywords: media;movies;tv;torrent;streaming;

publish:
  provider: generic
  url: https://github.com/watchnexus/watchnexus/releases/download/
