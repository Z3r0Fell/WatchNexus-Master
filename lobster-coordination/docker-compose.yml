version: "3.8"

services:
  headscale:
    image: headscale/headscale:1.67
    container_name: lobster-headscale
    volumes:
      - ./config:/etc/headscale
      - headscale-data:/var/lib/headscale
    environment:
      - HEADSCALE_PORT=8080
    command: headscale serve
    restart: unless-stopped
    networks:
      - lobster-net

  headscale-postgres:
    image: postgres:16-alpine
    container_name: lobster-headscale-db
    volumes:
      - headscale-db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=headscale
      - POSTGRES_PASSWORD=${HEADSCALE_DB_PASSWORD:-headscale}
      - POSTGRES_DB=headscale
    restart: unless-stopped
    networks:
      - lobster-net

volumes:
  headscale-data:
  headscale-db-data:

networks:
  lobster-net:
    driver: bridge
